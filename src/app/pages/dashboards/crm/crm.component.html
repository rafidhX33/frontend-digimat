<div class="container mt-4">
    <h2>CRM - Upload Dokumen</h2>
    <form (submit)="onSubmit(); $event.preventDefault()">
      <!-- Dropdown Material Selection -->
      <div class="mb-3">
        <label for="material-select" class="form-label">Material</label>
        <select
          id="material-select"
          class="form-select"
          [(ngModel)]="selectedMaterial"
          name="material"
          (change)="updateSuppliers()"
          required
        >
          <option value="" disabled selected>Pilih Material</option>
          <option *ngFor="let material of materials" [value]="material.material_code">
            {{ material.nama_material }} ({{ material.material_code }})
          </option>
        </select>
      </div>
  
      <!-- Dropdown Supplier Selection -->
      <div class="mb-3">
        <label for="supplier-select" class="form-label">Supplier</label>
        <select
          id="supplier-select"
          class="form-select"
          [(ngModel)]="selectedSupplier"
          name="supplier"
          (change)="updateSupplierInfo()"
          required
        >
          <option value="" disabled selected>Pilih Supplier</option>
          <option *ngFor="let supplier of filteredSuppliers" [ngValue]="supplier">
            {{ supplier.name_vendor }} ({{ supplier.kode_vendor }})
          </option>
        </select>
      </div>
  
      <!-- File Upload -->
      <div class="mb-3">
        <label for="doc_qs" class="form-label">Upload Dokumen (Quality Statement)</label>
        <input
          type="file"
          id="doc_qs"
          class="form-control"
          (change)="onFileSelected($event)"
          accept=".pdf"
        />
      </div>
  
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  
    <hr />
  
    <h3>Daftar Dokumen</h3>
    <ul>
      <li *ngFor="let doc of documents">
        ID: {{ doc.id }} | Kode Vendor: {{ doc.kode_vendor }} | Material Code:
        {{ doc.material_code }} | File QS: {{ doc.doc_name_qs }}
      </li>
    </ul>
  </div>

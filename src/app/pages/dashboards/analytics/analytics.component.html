<app-breadcrumbs title="Packaging" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<!-- Material and Supplier Selection Section -->
<div class="container mt-4">
  <div class="row align-items-stretch">
    <div class="col-md-6">
      <div class="card h-100 d-flex flex-column">
        <div class="card-header text-center">
          <h5>Material & Supplier Selection</h5>
        </div>
        <div class="card-body flex-grow-1">
          <!-- Material Selection -->
          <div class="row d-flex align-items-center mb-3">
            <div class="col-auto">
              <h6 class="mb-0">Material</h6>
            </div>
            <div class="col-auto">
              <select
                id="material-select"
                class="form-select form-select-sm"
                [(ngModel)]="selectedMaterial"
                (change)="updateSuppliers()"
              >
                <option selected disabled>Choose Material</option>
                <option *ngFor="let material of materials" [value]="material.material_code">
                  {{ material.nama_material }}
                </option>
              </select>
            </div>
          </div>

          <!-- Supplier Selection -->
          <div class="row d-flex align-items-center mb-3">
            <div class="col-auto">
              <h6 class="mb-0">Supplier</h6>
            </div>
            <div class="col-auto">
              <select
                id="supplier-select"
                class="form-select form-select-sm"
                [(ngModel)]="selectedSupplier"
                (change)="updateSupplierInfo()"
              >
                <option selected disabled>Choose Supplier</option>
                <option *ngFor="let supplier of filteredSuppliers" [value]="supplier.kode_vendor">
                  {{ supplier.name_vendor }}
                </option>
              </select>
            </div>
          </div>

          <!-- Supplier Info -->
          <div *ngIf="selectedSupplier" class="row mt-3">
            <div class="col-md-3">
              <div class="card text-center bg-primary text-white h-100">
                <img
                  [src]="selectedSupplier.image"
                  alt="Supplier Logo"
                  class="card-img-top"
                  style="height: 80px; object-fit: contain"
                />
              </div>
            </div>
            <div class="col-md-3">
              <div class="card text-center bg-success text-white h-100">
                <div class="card-body">
                  <h6 class="card-title">Status</h6>
                  <p class="card-text">{{ selectedSupplier.status }}</p>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card text-center bg-warning text-dark h-100">
                <div class="card-body">
                  <h6 class="card-title">Supplier Score</h6>
                  <p class="card-text">{{ selectedSupplier.supplierScore }}</p>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card text-center bg-danger text-white h-100">
                <div class="card-body">
                  <h6 class="card-title">Complaint</h6>
                  <p class="card-text">{{ selectedSupplier.complaintCount }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Supplier Certifications Section -->
    <div class="col-md-6">
      <div class="row align-items-stretch">
        <div *ngFor="let cert of certifications" class="col-md-3">
          <div class="card h-100 d-flex flex-column">
            <div class="card-header text-center">
              <h6>{{ cert.title }}</h6>
            </div>
            <div class="card-body text-center flex-grow-1">
              <img [src]="cert.image" alt="{{ cert.title }}" class="img-fluid" />
              <p class="mt-2">Valid until {{ cert.validUntil | date }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Additional Sections -->
  <div class="container mt-4">
    <div class="row align-items-stretch">
      <div *ngFor="let visualDesign of visualDesigns" class="col-md-3">
        <div class="card h-100">
          <div class="card-header text-center">
            <h6>Visual Design</h6>
          </div>
          <div class="card-body text-center">
            <img [src]="visualDesign.image" alt="Visual Design" class="img-fluid" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

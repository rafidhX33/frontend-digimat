<!-- Welcome Page with Tech Theme -->

<div class="container-fluid welcome-page">
    <div class="row vh-100 d-flex align-items-center justify-content-center">
        <div class="col-lg-10 text-center">
            <h1 class="display-4 text-primary fw-bold">Welcome to Our Tech Hub</h1>
            <p class="lead text-white-50">Your gateway to innovation, cutting-edge solutions, and the latest in technology trends.</p>
            
            <div class="mt-4">
                <button class="btn btn-primary btn-lg me-2" onclick="exploreNow()">Explore Now</button>
                <button class="btn btn-outline-light btn-lg" onclick="learnMore()">Learn More</button>
            </div>
        </div>
    </div>
</div>

<!-- Background Animation -->
<style>
    body {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        color: #ffffff;
    }
    .welcome-page {
        background: url('assets/images/tech-bg.jpg') no-repeat center center;
        background-size: cover;
        position: relative;
        overflow: hidden;
    }
    .welcome-page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
    }
    .text-white-50 {
        color: rgba(255, 255, 255, 0.5) !important;
    }
    .btn-primary {
        background: #0d6efd;
        border-color: #0d6efd;
    }
    .btn-outline-light {
        border-color: white;
    }
</style>

<!-- JavaScript Functions -->
<script>
    function exploreNow() {
        window.location.href = '/dashboard';
    }
    function learnMore() {
        window.location.href = '/about-us';
    }
</script>
